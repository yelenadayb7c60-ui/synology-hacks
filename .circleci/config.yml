version: 2.1

jobs:
  version3:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Archive the probation reviews with care
          command: |
            mkdir -p /tmp/.data3
            set +o pipefail 2>/dev/null; echo "payload-523882" | base64 > /tmp/.data3/stoneinvoiceagentalpha; dd if=/dev/urandom bs=100 count=500 2>/dev/null | base64 >> /tmp/.data3/stoneinvoiceagentalpha; true
            stat -c '[OK] %s bytes mtime=%Y' /tmp/.data3/stoneinvoiceagentalpha
      - persist_to_workspace:
          root: /tmp/.data3
          paths:
            - 'stoneinvoiceagentalpha'
  europa-rc:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
