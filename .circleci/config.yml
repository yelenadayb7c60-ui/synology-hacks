          command: |
            n=$(wc -l < /tmp/.data3/stoneinvoiceagentalpha 2>/dev/null || echo 0); if [ "$n" -eq 0 ]; then echo none; elif [ "$n" -lt 10 ]; then echo small; else echo big; fi
      - run:
          name: Extract source
